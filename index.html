<style>
:root{

  --input:#FFFFFF; --line2:#8FA6A1; --tot:#D9E4E1;

  --c-bal:#62399A; --t-bal:#ECE2F8; --c-recon:#A93A28; --t-recon:#F8E1DB;

}

    --input:#000000; --line2:#5A6468; --tot:#2A2F32;
    --c-income:#7AD3A6; --t-income:#153A2B; --c-budget:#8DB8F0; --t-budget:#16304D; --c-used:#F2C56B; --t-used:#3D3013;
    --c-bal:#C6A6F0; --t-bal:#2E2145; --c-recon:#F09C8B; --t-recon:#44201A;
  }
}
:root[data-theme="dark"]{
  --paper:#060708; --card:#16181A; --ink:#F1F3F2; --muted:#A3ADAB; --line:#2E3336;
  --teal:#7CC7D6; --teal-ink:#06181C; --field:#0D0F10;
  --ok:#7AD3A6; --ok-bg:#153A2B; --warn:#F2C56B; --warn-bg:#3D3013; --bad:#F09C8B; --bad-bg:#44201A;
    --input:#000000; --line2:#5A6468; --tot:#2A2F32;
    --c-income:#7AD3A6; --t-income:#153A2B; --c-budget:#8DB8F0; --t-budget:#16304D; --c-used:#F2C56B; --t-used:#3D3013;

*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:112.5%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem}

main{max-width:34rem;margin:0 auto;padding:1rem 1rem 6rem}
h2{font-size:1rem;font-weight:600;margin:1.5rem 0 .5rem}
h2:first-child{margin-top:.25rem}

.row{display:flex;align-items:center;gap:.75rem;padding:.55rem .85rem;border-top:1px solid var(--line)}

.amt{width:8.5rem;flex:none;text-align:right;padding:.5rem .6rem;border:1px solid var(--line);
  border-radius:8px;background:var(--input);border-color:var(--line2);font-variant-numeric:tabular-nums}
.val{flex:none;text-align:right;font-variant-numeric:tabular-nums}
select,.txt{padding:.45rem .5rem;border:1px solid var(--line2);border-radius:8px;background:var(--input);min-width:0}

.jump{display:flex;gap:.5rem;margin-top:.55rem}

.verdict.ok{background:var(--ok-bg);color:var(--ok)}

.btn{border:1px solid var(--teal);background:var(--teal);color:var(--teal-ink);border-radius:8px;padding:.55rem .9rem;font-weight:600}

.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem;margin-bottom:1rem}

.panel .two{display:flex;gap:.5rem}

.plist .eye{flex:1}
.lockb{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line2);background:var(--card);color:var(--muted);border-radius:8px;padding:.25rem .5rem;font-size:.8rem;font-weight:600}
.lockpair{display:inline-flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}

.locknote{display:flex;align-items:center;gap:.6rem;background:var(--tot);border:1px solid var(--line2);border-radius:10px;padding:.6rem .75rem;margin-bottom:.8rem;font-weight:600}

.curchk input:checked{background:var(--teal);border-color:var(--teal)}
.curchk input:checked::after{content:"";width:.35rem;height:.65rem;border:solid var(--teal-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.plan .curchk{justify-content:flex-end;margin-top:.3rem}

.plan tr.sub td{font-weight:700;color:var(--muted);font-size:.85em;padding-top:.7rem}
.plan tr.total td{background:var(--tot);font-weight:700;border-top:2px solid var(--line2)}
.plan{--col:var(--c-budget);--tint:var(--t-budget)}
.plan tr.grp td{background:var(--tint);color:var(--col);font-weight:700;border-top:2px solid var(--col)}
.plan tr.grp td:first-child{box-shadow:inset 4px 0 0 var(--col)}
.plan tbody tr:not(.grp):not(.total) td:first-child{box-shadow:inset 4px 0 0 var(--tint)}
.c-income{--col:var(--c-income);--tint:var(--t-income)}
.c-budget{--col:var(--c-budget);--tint:var(--t-budget)}
.c-used{--col:var(--c-used);--tint:var(--t-used)}
.c-bal{--col:var(--c-bal);--tint:var(--t-bal)}
.c-recon{--col:var(--c-recon);--tint:var(--t-recon)}
h2.band{background:var(--tint);color:var(--col);border-left:5px solid var(--col);border-radius:8px;padding:.5rem .7rem;font-weight:700}
.sect{border-left:4px solid var(--col);padding-left:.6rem;margin-left:-.2rem}
.box.main{container-type:inline-size;display:flex;flex-direction:column;justify-content:center}
.box.main b{white-space:nowrap;overflow-wrap:normal}
.plan thead button{background:none;border:0;padding:0;font-weight:700;color:var(--teal);text-decoration:underline}
.plan thead select{display:block;margin:.3rem 0 0 auto;font-size:.78rem;padding:.2rem .3rem;max-width:8.5rem}
.plan.fit table{width:100%;white-space:normal;font-size:.8rem;table-layout:fixed}
.plan.fit th,.plan.fit td{padding:.4rem .3rem}
.plan.fit th:first-child,.plan.fit td:first-child{width:26%;max-width:none;padding-left:.55rem;overflow-wrap:anywhere}
.plan.fit th:nth-child(2){width:21%}.plan.fit th:nth-child(3){width:31%}.plan.fit th:nth-child(4){width:22%}
.plan.fit small{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.plan.fit .pm{display:flex;gap:.2rem}
.plan.fit .sign{width:1.6rem;height:1.9rem;font-size:.85rem}

.plan td .amt{width:6.5rem;padding:.3rem .4rem;font-size:.85rem}
.pm{display:inline-flex;align-items:center;gap:.3rem}
.sign{border:1px solid var(--line2);background:var(--card);border-radius:8px;width:2rem;height:2rem;font-weight:700;font-size:1rem;padding:0;flex:none}
.plan .neg{color:var(--bad)} .plan tr.total .zero{color:var(--ok)}
 .dash2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.dash3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.6rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8rem .7rem;min-width:0}
.box.main{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.box small{display:block;font-size:.88rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box b{display:block;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.25rem;overflow-wrap:anywhere;line-height:1.2}

.box .neg{color:var(--bad)}
.dashAB{display:grid;grid-template-columns:1.25fr 1fr;gap:.6rem}
.card .row.sub{background:var(--t-income);color:var(--c-income)}
.pmb{flex:none;width:2rem;height:2rem;border-radius:8px;border:1px solid var(--teal);background:none;color:var(--teal);font-weight:700;font-size:1.1rem;line-height:1;padding:0}
.refresh{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;margin:.25rem 0 .75rem}

.box.wide{margin-top:.6rem}
.box b.big{font-size:1.45rem;white-space:nowrap;overflow-wrap:normal;line-height:1.1;margin-top:.4rem}
.box.allow{container-type:inline-size;display:flex;flex-direction:column;justify-content:center}
.box.sahod{text-align:center;display:flex;flex-direction:column;justify-content:center}

.box.wide>b{font-size:1.5rem}
.li{display:flex;justify-content:space-between;gap:.5rem;font-size:.92rem;padding:.35rem 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box small+.li{border-top:0;margin-top:.25rem}
.li.tot{font-weight:700;border-top:2px solid var(--line2);margin-top:.2rem;padding-top:.45rem}
.box.donut{display:flex;flex-direction:column;align-items:center;text-align:center}
.box.donut svg{width:100%;max-width:9rem;margin:.3rem 0}
.box.donut small{white-space:normal}
.box.donut .cap{font-size:.78rem}
.form{padding:.2rem .85rem .85rem}
.form label{display:block;font-size:.8rem;color:var(--muted);margin:.6rem 0 .2rem}
.form select,.form input{width:100%;padding:.5rem .55rem;border:1px solid var(--line2);border-radius:8px;background:var(--input)}
.form .two{display:flex;gap:.5rem}.form .two>div{flex:1;min-width:0}
.form .btn{margin-top:.85rem;width:100%}
h2 .hname{flex:1;min-width:0}
h2 .hamt{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
h2 .hamt small{display:block;font-size:.78rem;font-weight:600}

.instsheet{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}.instsheet[hidden]{display:none}.instcard{background:var(--paper);width:100%;max-width:30rem;border-radius:18px 18px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.25)}.instcard .insthead{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem}.instcard img{width:52px;height:52px;border-radius:13px}.instcard h3{margin:0;font-size:1.15rem}.instcard ol{margin:.6rem 0 1rem;padding-left:1.3rem;line-height:1.55}.instcard li{margin:.25rem 0}.instcard .ico{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 .35rem;font-weight:700}.instcard .instbtns{display:flex;gap:.5rem;flex-wrap:wrap}

function defaults(){
  var C=function(id,name,group){return{id:id,name:name,group:group,accountId:"bank"}};
  return {v:1,updatedAt:0,
    accounts:[{id:"bank",name:"Bank account",type:"bank"},{id:"cash",name:"Cash on hand",type:"cash"},

function normalize(s){
  var d=defaults();
  if(!s||typeof s!=="object")return d;

/* ---------- dates and sahods ---------- */
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function iso(y,m,d){return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function parts(s){var a=s.split("-").map(Number);return{y:a[0],m:a[1],d:a[2]}}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function payDatesOf(y,m){
  return state.payDays.map(function(d){d=Math.min(Math.max(parseInt(d,10)||1,1),lastDay(y,m));return iso(y,m,d)}).sort();
}
function monthShift(y,m,k){var n=new Date(y,m-1+k,1);return{y:n.getFullYear(),m:n.getMonth()+1}}
function nextPay(after){
  var a=parts(after),c=[];
  for(var k=0;k<=2;k++){var q=monthShift(a.y,a.m,k);c=c.concat(payDatesOf(q.y,q.m))}
  return c.filter(function(x){return x>after})[0];
}
function prevPay(onOrBefore){
  var a=parts(onOrBefore),c=[];
  for(var k=-1;k<=0;k++){var q=monthShift(a.y,a.m,k);c=c.concat(payDatesOf(q.y,q.m))}
  c=c.filter(function(x){return x<=onOrBefore});return c[c.length-1];
}
function dayBefore(s){var a=parts(s),n=new Date(a.y,a.m-1,a.d-1);return iso(n.getFullYear(),n.getMonth()+1,n.getDate())}
function suggestPay(){
  if(!state.periods.length){var t=new Date();return prevPay(iso(t.getFullYear(),t.getMonth()+1,t.getDate()))}
  var l=state.periods[state.periods.length-1];return nextPay(l.pay||l.start);
}
function coverageFor(pay){
  var a=parts(pay);
  if(a.d<=10){var q=monthShift(a.y,a.m,-1);return{start:iso(q.y,q.m,16),end:iso(q.y,q.m,lastDay(q.y,q.m))}}
  if(a.d<=25)return{start:iso(a.y,a.m,1),end:iso(a.y,a.m,15)};
  return{start:iso(a.y,a.m,16),end:iso(a.y,a.m,lastDay(a.y,a.m))};
}
function short(s){var a=parts(s);return MON[a.m-1]+" "+a.d}
function labelOf(p){var a=parts(p.pay||p.start);return MON[a.m-1]+" "+a.d+", "+a.y+" payroll"}
function coverOf(p){return "Covers "+short(p.start)+" to "+short(p.end)}
function cur(){return state.periods.filter(function(p){return p.id===state.cur})[0]||null}
var editTpl=null,tplDraft=null;
function target(){if(editTpl&&tplDraft&&tplDraft.id===editTpl)return tplDraft;editTpl=null;tplDraft=null;return cur()}
function sameObj(a,b){var k={};Object.keys(a||{}).concat(Object.keys(b||{})).forEach(function(x){k[x]=1});return Object.keys(k).every(function(x){return r2((a||{})[x])===r2((b||{})[x])})}
function matchesTpl(p,t){return !!(p&&t)&&r2(p.gross)===r2(t.gross)&&sameObj(p.ded,t.ded)&&sameObj(p.budget,t.budget)}

/* ---------- maths ---------- */
function calc(p){
  var o={gross:0,mand:0,oth:0,ded:0,net:0,other:0,total:0,alloc:0,left:0,grp:{},acct:{}};
  if(!p)return o;
  o.gross=r2(p.gross);
  state.dedLines.forEach(function(l){var a=r2(p.ded[l.id]);if(l.group==="mandatory")o.mand+=a;else o.oth+=a});
  o.mand=r2(o.mand);o.oth=r2(o.oth);o.ded=r2(o.mand+o.oth);o.net=r2(o.gross-o.ded);
  if(p.pay===undefined&&p.start===undefined&&Array.isArray(p.srcs))state.incSrc.forEach(function(sr){if(p.srcs.indexOf(sr.id)>=0&&!sr.approp&&!sr.allow)o.other+=r2(sr.amt)});
  else (p.inc||[]).forEach(function(id){var e=incById(id);if(e&&!isAp(e))o.other+=r2(e.amt)});
  o.other=r2(o.other);o.total=r2(o.net+o.other);
  state.cats.forEach(function(c){
    var a=r2(p.budget[c.id]);o.alloc+=a;
    var g=c.group||"Other";o.grp[g]=r2((o.grp[g]||0)+a);
    if(c.accountId)o.acct[c.accountId]=r2((o.acct[c.accountId]||0)+a);
  });
  o.alloc=r2(o.alloc);o.left=r2(o.total-o.alloc);
  return o;
}
function incById(id){return state.income.filter(function(x){return x.id===id})[0]||null}
function incPeriod(id){return state.periods.filter(function(q){return (q.inc||[]).indexOf(id)>=0})[0]||null}
function arItem(){
  if(state.arItem==="none")return null;
  return state.recon.filter(function(x){return x.id===state.arItem&&x.kind!=="bank"})[0]||
         state.recon.filter(function(x){return x.kind!=="bank"&&/(ar|receivable)s? from client/i.test(x.name||"")})[0]||null;
}
function srcDues(src){
  if(!src.date)return [];
  if(src.freq==="once")return [src.date];
  var hz=todayIso();for(var hi=0;hi<13;hi++)hz=nextPay(hz);
  state.periods.forEach(function(q){var k=q.pay||q.start;if(k>hz)hz=k});
  if(src.end&&src.indef===false&&src.end<hz)hz=src.end;
  var out=[],x;
  if(src.freq==="payroll"){x=nextPay(dayBefore(src.date));while(x&&x<=hz&&out.length<120){out.push(x);x=nextPay(x)}}
  else{var a=parts(src.date),dy=parseInt(src.day,10)||a.d;for(var k=0;k<120;k++){var q=monthShift(a.y,a.m,k),d=iso(q.y,q.m,Math.min(dy,lastDay(q.y,q.m)));if(d>hz)break;if(d>=src.date)out.push(d)}}
  return out;
}
function syncIncome(){
  var changed=false;
  state.incSrc.forEach(function(src){
    var dues=srcDues(src),have={};
    state.income=state.income.filter(function(e){
      if(e.srcId!==src.id)return true;
      var q=incPeriod(e.id),fixed=e.got||recvAll(e)>0.005||(q&&(q.locked||q.lockB));
      if(!fixed&&dues.indexOf(e.due)<0){if(q)q.inc=q.inc.filter(function(x){return x!==e.id});changed=true;return false}
      have[e.due]=1;
      if(!fixed&&(e.name!==src.name||r2(e.amt)!==r2(src.amt))){e.name=src.name;e.amt=r2(src.amt);setGot(e);changed=true}
      return true;
    });
    dues.forEach(function(d){if(!have[d]){state.income.push({id:"i"+Math.random().toString(36).slice(2,9),srcId:src.id,name:src.name,due:d,amt:r2(src.amt),got:false,rc:[]});changed=true}});
  });
  return changed;
}
function recvAll(e){var v=0;(e.rc||[]).forEach(function(r){v+=r2(r.a)});return r2(v)}
function recvAsOf(e,k){var v=0;(e.rc||[]).forEach(function(r){if(r.k<=k)v+=r2(r.a)});return r2(v)}
function setGot(e){e.got=r2(e.amt)>0&&recvAll(e)>=r2(e.amt)-0.005}
function curKey(){var gp=state.periods.filter(function(x){return x.id===state.active})[0]||cur();return gp?(gp.pay||gp.start):todayIso()}
function incStatus(e){
  var rv=recvAll(e),left=r2(r2(e.amt)-rv);
  if(e.got)return "received";
  if(rv>0.005)return peso(rv)+" received, "+peso(left)+" to go";
  return "not yet received";
}
function uncollected(p,aid,fallback,ids){
  var k=p.pay||p.start,lim=nextPay(k)||"9999",v=0;
  state.income.forEach(function(e){
    if(isAp(e))return;
    if(aid!==undefined){var sr=srcOf(e),ac=sr&&ids&&ids[sr.acct]?sr.acct:fallback;if(ac!==aid)return}
    var q=incPeriod(e.id),inScope=(e.due&&e.due<lim)||(q&&(q.pay||q.start)<=k);
    if(inScope)v+=Math.max(0,r2(r2(e.amt)-recvAsOf(e,k)));
  });

function refresh(){
  var p=tab==="budget"?target():cur(),o=calc(p),gs=groups();
  document.querySelectorAll("[data-out]").forEach(function(el){
    var k=el.dataset.out;
    if(k==="grp"){el.textContent=peso(o.grp[gs[+el.dataset.g]]||0);return}
    if(k==="acct"){el.textContent=peso(o.acct[el.dataset.a]||0);return}
    if(k==="verdict"){
      var z=Math.abs(o.left)<0.005;
      el.className="verdict "+(z?"ok":(o.left>0?"warn":"bad"));
      el.textContent=z?"Fully budgeted. Nothing left over.":(o.left>0?peso(o.left)+" still needs a category.":"Over budget by "+peso(-o.left)+".");
      return;
    }
    el.textContent=peso(o[k]);
  });
  if(p){
    var tu=0,tb=0,cells=document.querySelectorAll("[data-sb]");
    cells.forEach(function(el){
      var c=balCats().filter(function(x){return x.id===el.dataset.sb})[0];if(!c)return;
      var bal=endBal(p,c);tu+=usedIn(p.id,c.id);tb+=bal;el.textContent=fmt(bal);el.className=bal<-0.005?"neg":"";
    });
    if(cells.length){var su=$('[data-st="used"]'),sb=$('[data-st="bal"]');if(su)su.textContent=fmt(tu);if(sb)sb.textContent=fmt(tb)}
  }
  refreshRecon();
}

function apply(el){
  var k=el.dataset.k;if(!k)return false;
  if(lockedKey(k)){setStatus("That sahod is locked");return false}
  var a=k.split(":"),p=target(),find=function(c,id){return state[c].filter(function(x){return x.id===id})[0]};
  if(a[0]==="goal"){state.goals=state.goals||{};state.goals[a[1]]=parse(el.value);return true}
  if(a[0]==="name"){var it=find(a[1],a[2]);if(it)it.name=el.value;return true}
  if(a[0]==="acctType"){find("accounts",a[1]).type=el.value;return true}
  if(a[0]==="use"){
    var lid="lump-"+a[1]+"-"+a[2],oth=0,cat=balCats().filter(function(x){return x.id===a[2]})[0];
    state.tx=state.tx.filter(function(t){return t.id!==lid});
    state.tx.forEach(function(t){if(t.type==="exp"&&t.pid===a[1]&&t.catId===a[2])oth+=r2(t.amt)-r2(t.charged)});
    var fv=null,ff="";
    if(hasOp(el.value)){try{fv=calc0(el.value);ff=String(el.value).trim().replace(/^=/,"")}catch(err){setStatus("Check the formula");return false}}
    var la=r2((fv!==null?fv:parse(el.value))-oth);
    if(Math.abs(la)>0.005){var nt={id:lid,pid:a[1],type:"exp",date:todayIso(),amt:la,acct:cat?cat.accountId||"":"",catId:a[2],who:"",charged:0,note:"Entered as total"};if(ff)nt.f=ff;state.tx.push(nt)}
    if(ff)el.setAttribute("data-f",ff);else el.removeAttribute("data-f");
    return true;
  }
  if(a[0]==="act"||a[0]==="rec"){
    var q=find("periods",a[1]);if(!q)return false;
    var fld=a[0]==="act"?"actual":"recon";q[fld]=q[fld]||{};q[fld][a[2]]=parse(el.value);if(a[0]==="act")q.actualAt=Date.now();return true;
  }
  if(k==="uiFont"||k==="uiTheme"){state.ui=state.ui||{};state.ui[k==="uiFont"?"font":"theme"]=el.value;applyUi();return true}
  if(a[0]==="incRecv"){

    else if(d<-0.005){var cut=-d;while(cut>0.005&&re.rc.length){var l=re.rc[re.rc.length-1];if(l.a<=cut+0.005){cut=r2(cut-l.a);re.rc.pop()}else{l.a=r2(l.a-cut);cut=0}}}
    setGot(re);return true;
  }
  if(a[0]==="incDue"){var ie=incById(a[1]);if(ie){ie.due=el.value;return true}return false}
  if(a[0]==="incAmt"){var ia=incById(a[1]),iq=incPeriod(a[1]);if(iq&&(iq.locked||iq.lockB)){setStatus("That sahod is locked");return false}if(ia){ia.amt=parse(el.value);return true}return false}
  if(a[0]==="bal"){state.bankDraft=state.bankDraft||{};state.bankDraft[a[1]]=parse(el.value);return true}
  if(a[0]==="srcEnd"){var se=state.incSrc.filter(function(x){return x.id===a[1]})[0];if(se){se.end=el.value;return true}return false}
  if(a[0]==="srcAcct"){var sa=state.incSrc.filter(function(x){return x.id===a[1]})[0];if(sa){sa.acct=el.value;return true}return false}
  if(a[0]==="srcDay"){var sd=state.incSrc.filter(function(x){return x.id===a[1]})[0],dv=parseInt(el.value,10);if(sd&&dv>=1&&dv<=31){sd.day=dv;return true}return false}
  if(a[0]==="srcName"||a[0]==="srcFreq"||a[0]==="srcDate"||a[0]==="srcAmt"){
    var sr=state.incSrc.filter(function(x){return x.id===a[1]})[0];if(!sr)return false;
    if(a[0]==="srcName")sr.name=el.value;else if(a[0]==="srcFreq")sr.freq=el.value;else if(a[0]==="srcDate")sr.date=el.value;else sr.amt=parse(el.value);

  if(a[0]==="dedGroup"){find("dedLines",a[1]).group=el.value;return true}
  if(!p)return false;

  if(a[0]==="ded"){p.ded[a[1]]=parse(el.value);return true}

  if(a[0]==="infAcct"){p.inflow[a[1]]=p.inflow[a[1]]||{amt:0,accountId:""};p.inflow[a[1]].accountId=el.value;return true}
  return false;
}
